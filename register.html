<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طلب مساعدة - مؤسسة الحافظ للتنمية والخدمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط علوي -->
    <div class="bg-emerald-800 text-white py-2 px-4 text-sm text-center">
        <span>مؤسسة الحافظ للتنمية والخدمات - مشهرة برقم 2202 لسنة 2025</span>
    </div>

    <div class="container mx-auto max-w-3xl py-10 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold text-emerald-900 mb-2">استمارة طلب مساعدة بحثية</h1>
                <p class="text-gray-500 text-sm">يرجى تسجيل البيانات بدقة لضمان سرعة دراسة الحالة من قبل الباحثين الميدانيين.</p>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="space-y-6">
                
                <!-- بيانات رب الأسرة -->
                <div class="bg-gray-50 p-6 rounded-2xl border">
                    <h2 class="font-bold text-emerald-800 mb-4 text-lg border-b pb-2"><i class="fas fa-user ml-2"></i> أولاً: بيانات مقدم الطلب (رب الأسرة)</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">الاسم الرباعي (كما هو في البطاقة)</label>
                            <input type="text" id="fullName" required class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-1">الرقم القومي (14 رقماً)</label>
                                <input type="text" id="nationalId" maxlength="14" required placeholder="مثال: 300xxxxxxxxxxx" class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">رقم الهاتف المحمول (للتواصل)</label>
                                <input type="tel" id="phone" required placeholder="01xxxxxxxx" class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-1">الحالة الاجتماعية</label>
                                <select id="socialStatus" class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                    <option>أرملة / أرمل</option>
                                    <option>مطلق / مطلقة</option>
                                    <option>مهجور / مهجورة</option>
                                    <option>مريض / غير قادر على العمل</option>
                                    <option>أسر متعففة ذات دخل محدود</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">عدد أفراد الأسرة</label>
                                <input type="number" id="familyCount" min="1" value="1" required class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-1">العنوان التفصيلي</label>
                            <input type="text" id="address" required value="بني سويف - إهناسيا - منشأة عبدالصمد" class="w-full border rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                        </div>
                    </div>
                </div>

                <!-- نوع المساعدة المطلوبة -->
                <div class="bg-gray-50 p-6 rounded-2xl border">
                    <h2 class="font-bold text-emerald-800 mb-4 text-lg border-b pb-2"><i class="fas fa-hand-holding-medical ml-2"></i> ثانياً: نوع الدعم أو الخدمة المطلوبة</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="مساعدات مالية شهرية" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">مساعدات مالية / إعانة شهرية</span>
                        </label>
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="رعاية طبية وعلاج" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">رعاية طبية وعلاج أو عمليات</span>
                        </label>
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="تجهيز عروسة" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">تجهيز عروسة</span>
                        </label>
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="وصلة مياه نظيفة" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">وصلة مياه نظيفة</span>
                        </label>
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="رعاية الأيتام" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">رعاية الأيتام</span>
                        </label>
                        <label class="flex items-center space-x-3 space-x-reverse bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500">
                            <input type="checkbox" name="helpType" value="حالة طارئة واغاثة" class="w-4 h-4 text-emerald-600 rounded">
                            <span class="text-sm font-medium">حالة طارئة / إغاثة عاجلة</span>
                        </label>
                    </div>
                </div>

                <!-- إقرار صحة البيانات -->
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex items-start gap-3">
                    <input type="checkbox" id="declaration" required class="mt-1 w-4 h-4 text-emerald-600 rounded">
                    <label for="declaration" class="text-xs text-emerald-900 leading-relaxed">
                        أقر أنا المتقدم بأن كافة البيانات المسجلة أعلاه صحيحة ومطابقة للواقع، وأتفهم أن المؤسسة تقوم بدراسة ميدانية دقيقة لتحديد أولويات الاستحقاق وصرف الدعم لمستحقيه.
                    </label>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base">
                    <i class="fas fa-paper-plane ml-2"></i> إرسال الطلب وحفظ البيانات
                </button>

                <div class="text-center pt-2">
                    <a href="index.html" class="text-sm text-emerald-700 hover:underline"><i class="fas fa-arrow-right ml-1"></i> العودة إلى الصفحة الرئيسية</a>
                </div>
            </form>

        </div>
    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();
            const idNumber = document.getElementById('nationalId').value;
            if(idNumber.length !== 14) {
                alert('خطأ: الرقم القومي يجب أن يكون 14 رقماً صحيحاً.');
                return;
            }
            
            // توليد رقم تتبع عشوائي للطلب
            const trackingNum = 'ALHAFIZ-' + Math.floor(100000 + Math.random() * 900000);
            
            alert('تم إرسال طلبك بنجاح للمؤسسة!\n\nرقم التتبع الخاص بك هو: ' + trackingNum + '\nاحتفظ بهذا الرقم للاستعلام عن حالة الطلب لاحقاً.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
